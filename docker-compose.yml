services:

  postgres:
    image: postgres:18
    container_name: flexbox-postgres-dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: America/Halifax
    ports:
      - "5434:5432"
    restart: unless-stopped

    volumes:
      - pgdata:/var/lib/postgresql/18/docker
      # All scripts in the ./init-db directory execute when the container starts for the first time
      - ./database/init:/docker-entrypoint-initdb.d/create_database.sql


    # Make sure Spring Boot waits until PostgreSQL is ready
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: