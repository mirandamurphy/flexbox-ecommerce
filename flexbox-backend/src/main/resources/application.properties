spring.application.name=flexbox-backend

logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.beans.factory.support=DEBUG

# Docker
spring.docker.compose.enabled=true

# PostgreSQL Driver
spring.datasource.driver-class-name=org.postgresql.Driver

# Migration Datasource
spring.flyway.enabled=true
spring.flyway.url=jdbc:postgresql://app-db:5432/flexbox?stringtype=unspecified
#spring.flyway.url=spring.datasource.url=jdbc:postgresql://localhost:5434/flexbox?stringtype=unspecified
spring.flyway.user=${DB_MIGRATION_ROLE}
spring.flyway.password=${MIGRATION_DB_PASSWORD}
spring.flyway.locations=classpath:db/migration
logging.level.org.flywaydb=DEBUG
logging.level.org.springframework.boot.autoconfigure.flyway=DEBUG

# App Datasource
#spring.datasource.url=spring.datasource.url=jdbc:postgresql://localhost:5434/flexbox?stringtype=unspecified
spring.datasource.url=jdbc:postgresql://app-db:5432/flexbox?stringtype=unspecified
spring.datasource.username=${DB_APP_ROLE}
spring.datasource.password=${DB_APP_PASSWORD}

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Stripe
stripe.api.secret-key=${STRIPE_SECRET_KEY}
stripe.api.webhook-secret=${STRIPE_WEBHOOK_SECRET}

# Checkout redirect URLs
app.checkout.success-url=${CHECKOUT_SUCCESS_URL:http://localhost:5173/order-confirmation}
app.checkout.cancel-url=${CHECKOUT_CANCEL_URL:http://localhost:5173/checkout}

# JWT
jwt.secret=${JWT_SECRET}

# Email (Mailtrap sandbox SMTP for development, per A1 dependency list)
spring.mail.host=${MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:no-reply@flexbox.ca}

