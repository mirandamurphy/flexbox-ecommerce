spring.application.name=flexbox-backend-test

# Stripe (dummy values, no real Stripe calls happen in these tests)
stripe.api.secret-key=sk_test_dummy
stripe.api.webhook-secret=whsec_dummy

# Checkout redirect URLs
app.checkout.success-url=http://localhost:3000/checkout/success
app.checkout.cancel-url=http://localhost:3000/checkout/cancel

# JWT (dummy value, no real tokens need to be valid across restarts in tests)
jwt.secret=test_secret_key_at_least_32_characters_long_for_testing

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
