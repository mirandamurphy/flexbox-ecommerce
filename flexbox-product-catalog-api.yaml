openapi: "3.1.0"
info:
  title: Product Catalog API
  description: Flexbox Ecommerce Product Catalog API
  version: "1.0.0"
servers:
  - url: "https://flexbox_ecommerce"
paths:
  /subscription-boxes:
    get:
      summary: "GET subscription-boxes"
      operationId: "getAllSubscriptionBoxes"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SubscriptionBoxListResponse"
  /subscription-boxes/{id}:
    get:
      summary: "GET subscription-boxes/{id}"
      operationId: "getSubscriptionBoxById"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int64"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/SubscriptionBoxDetail"
  /products:
    get:
      summary: "GET products"
      operationId: "getAllProducts"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductListResponse"
  /products/{id}:
    get:
      summary: "GET products/{id}"
      operationId: "getProductById"
      parameters:
        - name: "id"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int64"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProductDetail"
  /admin/analytics/dashboard:
    get:
      summary: "GET admin analytics dashboard"
      operationId: "getAnalyticsDashboard"
      responses:
        "200":
          description: "OK"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AnalyticsDashboardResponse"
components:
  schemas:
    BigDecimal:
      type: "number"
      format: "double"
    SubscriptionBoxPriceSummary:
      type: "object"
      properties:
        amount:
          $ref: "#/components/schemas/BigDecimal"
        currency:
          type: "string"
    SubscriptionBoxSummary:
      type: "object"
      properties:
        id:
          type: "integer"
          format: "int64"
        name:
          type: "string"
        price:
          $ref: "#/components/schemas/SubscriptionBoxPriceSummary"
    SubscriptionBoxListResponse:
      type: "object"
      properties:
        data:
          type: "array"
          items:
            $ref: "#/components/schemas/SubscriptionBoxSummary"
    SubscriptionBoxProductSummary:
      type: "object"
      properties:
        productId:
          type: "integer"
          format: "int64"
        productName:
          type: "string"
        brand:
          type: "string"
        quantity:
          type: "integer"
          format: "int32"
    SubscriptionBoxDetail:
      type: "object"
      properties:
        id:
          type: "integer"
          format: "int64"
        name:
          type: "string"
        description:
          type: "string"
        price:
          $ref: "#/components/schemas/SubscriptionBoxPriceSummary"
        products:
          type: "array"
          items:
            $ref: "#/components/schemas/SubscriptionBoxProductSummary"
    CategorySummary:
      type: "object"
      properties:
        id:
          type: "integer"
          format: "int64"
        name:
          type: "string"
    ProductSummary:
      type: "object"
      properties:
        id:
          type: "integer"
          format: "int64"
        category:
          $ref: "#/components/schemas/CategorySummary"
        name:
          type: "string"
        description:
          type: "string"
        brand:
          type: "string"
    ProductListResponse:
      type: "object"
      properties:
        data:
          type: "array"
          items:
            $ref: "#/components/schemas/ProductSummary"
    ProductDetail:
      type: "object"
      properties:
        id:
          type: "integer"
          format: "int64"
        name:
          type: "string"
        brand:
          type: "string"
        description:
          type: "string"
        category:
          $ref: "#/components/schemas/CategorySummary"
        isActive:
          type: "boolean"

    AnalyticsDashboardResponse:
      type: "object"
      properties:
        data:
          $ref: "#/components/schemas/AnalyticsDashboard"

    AnalyticsDashboard:
      type: "object"
      properties:
        totalProducts:
          type: "integer"
          format: "int32"
        totalSubscriptionBoxes:
          type: "integer"
          format: "int32"
        averageBoxPrice:
          type: number
          format: double
        averageProductsPerBox:
          type: "number"
          format: "double"